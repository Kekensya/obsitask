[package]
name = "obsitask"
version = "0.1.0"
description = "A small desktop widget for the tasks in your Obsidian vault"
authors = ["Kekensya"]
license = "MIT"
repository = "https://github.com/Kekensya/obsitask"
edition = "2021"

[lib]
name = "obsitask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
